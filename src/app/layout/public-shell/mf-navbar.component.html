<header class="mf-navbar" [class.mf-navbar--scrolled]="scrolled()">
  <a class="mf-navbar__brand" routerLink="/" aria-label="Marques Felipe — Início">
    <span class="mf-navbar__brand-monogram" aria-hidden="true">MF</span>
    <span class="mf-navbar__brand-wordmark">MARQUES FELIPE</span>
  </a>

  <nav class="mf-navbar__desktop-nav" aria-label="Navegação principal">
    <a
      routerLink="/"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
      #desktopHome="routerLinkActive"
      [attr.aria-current]="desktopHome.isActive ? 'page' : null"
      >Início</a
    >
    <a routerLink="/" fragment="curadoria">Curadoria</a>
    <a
      routerLink="/showroom"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
      #desktopShowroom="routerLinkActive"
      [attr.aria-current]="desktopShowroom.isActive ? 'page' : null"
      >Showroom</a
    >
    <a routerLink="/" fragment="entregas">Entregas</a>
    <a routerLink="/" fragment="sobre">Sobre</a>
  </nav>

  <a class="mf-navbar__cta mf-frame" href="https://wa.me/557998709362">Fale com Felipe</a>

  <button
    #menuTrigger
    class="mf-navbar__menu-trigger"
    type="button"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="mf-mobile-menu"
    [attr.aria-label]="menuOpen() ? 'Fechar menu' : 'Abrir menu'"
    (click)="toggleMenu()"
  >
    <span></span>
    <span></span>
  </button>
</header>

@if (menuOpen()) {
  <section
    id="mf-mobile-menu"
    #mobileMenu
    class="mf-mobile-menu"
    role="dialog"
    aria-modal="true"
    aria-label="Menu principal"
  >
    <div class="mf-mobile-menu__header">
      <a routerLink="/" class="mf-mobile-menu__brand" (click)="closeMenu()">MARQUES FELIPE</a>
      <button
        class="mf-mobile-menu__close"
        type="button"
        aria-label="Fechar menu"
        (click)="closeMenu(true)"
      >
        Fechar
      </button>
    </div>

    <nav class="mf-mobile-menu__nav" aria-label="Navegação principal">
      <a
        #firstMobileLink
        routerLink="/"
        routerLinkActive
        [routerLinkActiveOptions]="{ exact: true }"
        #mobileHome="routerLinkActive"
        [attr.aria-current]="mobileHome.isActive ? 'page' : null"
        (click)="closeMenu()"
        >Início</a
      >
      <a routerLink="/" fragment="curadoria" (click)="closeMenu()">Curadoria</a>
      <a
        routerLink="/showroom"
        routerLinkActive
        [routerLinkActiveOptions]="{ exact: true }"
        #mobileShowroom="routerLinkActive"
        [attr.aria-current]="mobileShowroom.isActive ? 'page' : null"
        (click)="closeMenu()"
        >Showroom</a
      >
      <a routerLink="/" fragment="entregas" (click)="closeMenu()">Entregas</a>
      <a routerLink="/" fragment="sobre" (click)="closeMenu()">Sobre</a>
    </nav>

    <a class="mf-mobile-menu__cta mf-frame" href="https://wa.me/557998709362" (click)="closeMenu()"
      >Fale com Felipe</a
    >
  </section>
}
